pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
		}
	}
}

include ':app'
rootProject.name = "MangaLord"

// Keep the complete current parser source set local so anime support can be
// added without replacing or losing MangaLord's existing manga sources.
def localParsers = file('kotatsu-parsers')
if (localParsers.isDirectory()) {
	includeBuild(localParsers) {
		dependencySubstitution {
			substitute module('com.github.clquwu:kotatsu-parsers-redo') using project(':')
		}
	}
}
