name: Build MangaLord

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mangalord-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust_builder
            ci

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          cargo install cargo-ndk --locked

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.13113456'

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources in CI
        run: dart format lib integration_test test

      - name: Verify Team X is the only manga source
        run: |
          legacy_name=$(printf 'Star%s' 'z')
          legacy_domain=$(printf 'star%s' 'zmanga.com')
          legacy_host=$(printf 'manga-s%s' 'tarz')
          if grep -RniE --exclude-dir=.git --exclude='*.lock' --exclude='build.yml' "$legacy_name|$legacy_domain|$legacy_host|$(printf 'star%s' 'z')" .; then
            echo 'Forbidden legacy source references found.'
            exit 1
          fi

      - name: Analyze Dart application code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib test integration_test

      - name: Run unit and widget tests
        run: flutter test test --coverage

      - name: Run source adapter tests explicitly
        run: flutter test test/anime_sources_test.dart

      - name: Build optimized release APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456"
          export CARGO_BUILD_JOBS=2
          flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Verify generated APK exists
        run: test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-arm64-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Upload obfuscation symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-symbols
          path: build/symbols
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-build-logs
          path: |
            build/**/*.log
            android/.gradle/**/*.log
          if-no-files-found: ignore

      - name: Report build summary
        if: always()
        run: |
          {
            echo '## MangaLord build summary'
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Ref: $GITHUB_REF"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
