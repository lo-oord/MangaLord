name: Build MangaLord

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mangalord-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          cargo install cargo-ndk --locked

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;29.0.13113456'

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib integration_test

      - name: Analyze Dart application code
        run: flutter analyze lib test

      - name: Run unit and widget tests
        run: flutter test test

      - name: Build release APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456"
          export CARGO_BUILD_JOBS=2
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-arm64-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
