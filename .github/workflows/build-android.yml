name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Restore permanent release keystore
        env:
          MANGALORD_KEYSTORE_BASE64: ${{ secrets.MANGALORD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MANGALORD_KEYSTORE_BASE64" || {
            echo "MANGALORD_KEYSTORE_BASE64 GitHub Secret is not configured." >&2
            exit 1
          }
          keystore="$RUNNER_TEMP/mangalord-release.keystore"
          printf '%s' "$MANGALORD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"

      - name: Build signed release APK
        env:
          MANGALORD_SIGNING_STORE: ${{ runner.temp }}/mangalord-release.keystore
          MANGALORD_SIGNING_STORE_PASSWORD: ${{ secrets.MANGALORD_KEYSTORE_PASSWORD }}
          MANGALORD_SIGNING_KEY_ALIAS: ${{ secrets.MANGALORD_KEY_ALIAS }}
          MANGALORD_SIGNING_KEY_PASSWORD: ${{ secrets.MANGALORD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MANGALORD_SIGNING_STORE_PASSWORD" || { echo "MANGALORD_KEYSTORE_PASSWORD is not configured." >&2; exit 1; }
          test -n "$MANGALORD_SIGNING_KEY_ALIAS" || { echo "MANGALORD_KEY_ALIAS is not configured." >&2; exit 1; }
          test -n "$MANGALORD_SIGNING_KEY_PASSWORD" || { echo "MANGALORD_KEY_PASSWORD is not configured." >&2; exit 1; }
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping files when available
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-mapping-files
          path: app/build/outputs/mapping/**/*.txt
          if-no-files-found: ignore
          retention-days: 14
