name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Create CI signing key
        env:
          MANGALORD_KEYSTORE_PASSWORD: ${{ secrets.MANGALORD_KEYSTORE_PASSWORD || 'mangalord-ci-store-password' }}
          MANGALORD_KEY_ALIAS: ${{ secrets.MANGALORD_KEY_ALIAS || 'mangalord-release' }}
          MANGALORD_KEY_PASSWORD: ${{ secrets.MANGALORD_KEY_PASSWORD || 'mangalord-ci-store-password' }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/mangalord-release.keystore" \
            -storepass "$MANGALORD_KEYSTORE_PASSWORD" \
            -alias "$MANGALORD_KEY_ALIAS" \
            -keypass "$MANGALORD_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MangaLord CI, OU=Build, O=MangaLord, L=Unknown, ST=Unknown, C=US"

      - name: Build signed release APK
        env:
          MANGALORD_SIGNING_STORE: ${{ runner.temp }}/mangalord-release.keystore
          MANGALORD_SIGNING_STORE_PASSWORD: ${{ secrets.MANGALORD_KEYSTORE_PASSWORD || 'mangalord-ci-store-password' }}
          MANGALORD_SIGNING_KEY_ALIAS: ${{ secrets.MANGALORD_KEY_ALIAS || 'mangalord-release' }}
          MANGALORD_SIGNING_KEY_PASSWORD: ${{ secrets.MANGALORD_KEY_PASSWORD || 'mangalord-ci-store-password' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping files when available
        uses: actions/upload-artifact@v4
        with:
          name: mangalord-mapping-files
          path: app/build/outputs/mapping/**/*.txt
          if-no-files-found: ignore
          retention-days: 14
